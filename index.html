<section id="login" class="login"><div class="panel"><div class="logo">🇩🇿</div><h1>Bienvenue sur Scolia</h1><p class="muted">Votre espace scolaire · Semestre 2 🇩🇿</p><label>Identifiant<input class="field" id="username" autocomplete="username" placeholder="Votre identifiant"></label><label>Mot de passe<input class="field" id="password" type="password" autocomplete="current-password" placeholder="Votre mot de passe"></label><p id="loginError" style="color:#ba3047"></p><button class="primary wide" onclick="login()">Se connecter →</button><p class="muted" style="font-size:12px">Les connexions, appareils et durées estimées sont enregistrés et visibles par l'administrateur. Démo familiale avec données fictives uniquement. Les comptes HTML ne sécurisent pas les données en ligne.</p></div></section>

<script>
// Démonstration uniquement : des mots de passe dans un HTML public ne sont PAS sécurisés.
const accounts=[{id:'elsahraoui',password:'Prof2026!',name:'M. El Sahraoui',role:'prof'},{id:'sahli',password:'Prof2026!',name:'M. Sahli',role:'prof'},{id:'sahliremplacant',password:'Prof2026!',name:'M. Sahli remplaçant',role:'prof'},{id:'gueblaoui',password:'Prof2026!',name:'M. Gueblaoui',role:'prof'},...['abdelrahman','ahmed','assia','leah','mohamed','nolan'].map(id=>({id,password:'Scolia2026!',name:id[0].toUpperCase()+id.slice(1),role:'eleve'}))];
const students=accounts.filter(x=>x.role==='eleve'),subjects=['Musique','Arts plastiques','Sport','Football','Technologie'],levels={vert:'Très bonne maîtrise',bleu:'Maîtrise satisfaisante',jaune:'Maîtrise fragile',rouge:'Maîtrise insuffisante'};
const classNames={'6A':'6ème A','6B':'6ème B'};const classOf=id=>['abdelrahman','ahmed','assia'].includes(id)?'6A':'6B';let selectedClass='6A';const classStudents=()=>students.filter(st=>classOf(st.id)===selectedClass);const classTeacher=c=>c==='6A'?'M. El Sahraoui':'M. Sahli';const currentWindow=()=>data.appWindows?.[selectedClass]||data.appWindow||{active:false,start:'',end:'',semester:'1'};const SESSION_KEY='scolia_session_v2';let data={evaluations:[],mots:[],alerts:[]},user=null,semester='2',subject='Musique',currentTab='notes';
// Aucune donnée scolaire stockée localement : Firebase uniquement.
data.courses??=[];data.quizzes??=[];data.messages??=[];data.quizAttempts??=[];data.seenEvaluations??={};data.appreciations??={};data.appWindow??={active:false,start:'',end:'',semester:'1'};
function save(){if(!window.scoliaCloudReady){toast('Firebase non connecté : enregistrement impossible');return;}window.scoliaCloudSave(structuredClone(data)).catch(e=>{console.error(e);toast('Échec Firebase : '+(e.code||e.message));})}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function notify(message,recipient){data.alerts.push({id:uid(),recipient,message,at:new Date().toISOString(),seen:false})}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3500)}
function login(){let id=document.getElementById('username').value.trim().toLowerCase(),pw=document.getElementById('password').value;user=accounts.find(a=>a.id===id&&a.password===pw)||null;if(!user){document.getElementById('loginError').textContent='Identifiant ou mot de passe incorrect';return}sessionStorage.setItem(SESSION_KEY,user.id);showLoggedIn();startConnectionLog();return;}function showLoggedIn(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('welcome').textContent=user.name+' · '+(user.role==='prof'?'Professeur':'Élève');selectedClass=user.role==='eleve'?classOf(user.id):(user.id==='sahli'?'6B':'6A');if(user.id==='gueblaoui')subject='Football';semester='2';document.getElementById('appreciationsNav').classList.toggle('hidden',!isAdmin());document.getElementById('sessionsNav').classList.toggle('hidden',!isAdmin());tab('notes')}function logout(){endConnectionLog();sessionStorage.removeItem(SESSION_KEY);user=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('password').value=''}function tab(t){if(t==='archives'&&!user)return;currentTab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));document.getElementById('pageTitle').textContent={notes:'Notes & compétences',mots:'Mots',messages:'Messagerie',bulletins:'Bulletins',qcm:'Évaluations en ligne',cours:'Cours',notifications:'Notifications',appreciations:'Appréciations',archives:'Archives du semestre 1'}[t];render()}
function render(){if(!user)return;semester='2';bulletinSemester='2';const archiveNav=document.querySelector('[data-tab=archives]');if(archiveNav)archiveNav.classList.toggle('hidden',!archiveAuthorized());const mc=document.getElementById('messageCount');if(mc)mc.textContent=(data.messages||[]).filter(m=>m.to===user.id&&!m.readBy?.includes(user.id)).length? '🔵':'';document.getElementById('alertDot').classList.toggle('hidden',!data.alerts.some(a=>a.recipient===user.id&&!a.seen));if(currentTab==='notes')renderNotes();else if(currentTab==='bulletins')renderBulletins();else if(currentTab==='qcm')renderQCM();else if(currentTab==='cours')renderCours();else if(currentTab==='messages')renderMessages();else if(currentTab==='archives')renderArchives();else if(currentTab==='mots')renderMots();else if(currentTab==='appreciations')renderAppreciations();else if(currentTab==='sessions'&&isAdmin())renderSessions();else renderAlerts()}

// Journal transparent des connexions : durée estimée à partir de l'activité du site.
let connectionId=null,connectionTimer=null,connectionStarted=false;
function deviceLabel(){const ua=navigator.userAgent||'';const system=/iPhone|iPad|iPod/i.test(ua)?'iOS / iPadOS':/Android/i.test(ua)?'Android':/Windows/i.test(ua)?'Windows':/Mac OS X/i.test(ua)?'macOS':/Linux/i.test(ua)?'Linux':'Inconnu';const type=/iPad|Tablet/i.test(ua)?'Tablette':/Mobi|iPhone|Android/i.test(ua)?'Téléphone':'Ordinateur';return type+' · '+system}
function startConnectionLog(){if(!user||connectionId)return;connectionId=uid();connectionStarted=false;const id=connectionId;const send=()=>{if(!user||connectionId!==id||document.hidden||!window.scoliaCloudReady)return;window.scoliaCloudConnection({id,userId:user.id,device:deviceLabel(),start:connectionStartAt,last:new Date().toISOString(),closed:false}).then(()=>connectionStarted=true).catch(console.error)};const connectionStartAt=new Date().toISOString();send();connectionTimer=setInterval(send,120000);window.addEventListener('focus',send,{passive:true});}
function endConnectionLog(){if(connectionTimer)clearInterval(connectionTimer);connectionTimer=null;if(connectionId&&window.scoliaCloudReady){window.scoliaCloudConnection({id:connectionId,userId:user.id,device:deviceLabel(),last:new Date().toISOString(),closed:true}).catch(console.error)}connectionId=null;}
function sessionDuration(e){const a=Date.parse(e.start),b=Date.parse(e.last||e.start);if(!Number.isFinite(a)||!Number.isFinite(b))return '—';const n=Math.max(0,Math.round((b-a)/60000));return n<60?n+' min':Math.floor(n/60)+' h '+(n%60)+' min'}
function renderSessions(){if(!isAdmin())return;const entries=(data.connectionLogs||[]).slice().sort((a,b)=>String(b.start).localeCompare(String(a.start)));document.getElementById('content').innerHTML=`<div class="card"><h2>🔐 Historique des connexions</h2><p class="muted">Élèves et professeurs · appareil détecté approximativement · heures locales. Durée estimée d'après les dernières activités enregistrées (toutes les 2 minutes environ), et non le temps passé devant l'écran. Historique limité aux 100 dernières connexions.</p><div class="rosterwrap"><table class="roster"><thead><tr><th>Compte</th><th>Appareil</th><th>Connexion</th><th>Dernière activité</th><th>Durée estimée</th></tr></thead><tbody>${entries.map(e=>`<tr><td>${esc(accounts.find(a=>a.id===e.userId)?.name||e.userId)}</td><td>${esc(e.device)}</td><td>${esc(new Date(e.start).toLocaleString('fr-FR'))}</td><td>${esc(new Date(e.last||e.start).toLocaleString('fr-FR'))}</td><td>${sessionDuration(e)}${e.closed?'':' (approximatif)'}</td></tr>`).join('')||'<tr><td colspan="5">Aucune connexion enregistrée.</td></tr>'}</tbody></table></div></div>`}

// Messagerie familiale : fils élève ↔ professeur, avec réponse directe.
const messageTeachers=['elsahraoui','sahli','gueblaoui'];
const isAdmin=()=>user?.id==='elsahraoui';
let messageSending=false;
function canViewThread(studentId,teacherId){return user&&(user.role==='eleve'?user.id===studentId:user.id===teacherId)}
function threadKey(studentId,teacherId){return studentId+'__'+teacherId}
function renderMessages(){
 const root=document.getElementById('content');
 const all=(data.messages||[]).filter(m=>user.role==='eleve'?m.studentId===user.id:m.teacherId===user.id);
 const ids=[...new Set(all.map(m=>m.threadId))];
 const teacherOpts=messageTeachers.map(id=>accounts.find(a=>a.id===id)).filter(Boolean);
 root.innerHTML=`<div class="card"><h2>💬 Messagerie Scolia</h2><p class="muted">Échanges entre élèves et professeurs. Les messages sont synchronisés sur les appareils.</p>${user.role==='eleve'?`<label>Choisir le professeur<select id="msgTeacher" class="field">${teacherOpts.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></label><button class="primary" onclick="openNewStudentMessage()">✉️ Écrire un message</button>`:''}</div><div class="card"><h3>Mes conversations</h3>${ids.length?ids.map(id=>{
 const msgs=all.filter(m=>m.threadId===id).sort((a,b)=>a.at.localeCompare(b.at));const last=msgs[msgs.length-1];const other=accounts.find(a=>a.id===(user.role==='eleve'?last.teacherId:last.studentId));const unread=msgs.filter(m=>m.to===user.id&&!m.readBy?.includes(user.id)).length;
 return `<div class="word"><strong>${esc(other?.name||'Conversation')}</strong> ${unread?`<span class="chip bleu">${unread} nouveau(x)</span>`:''}<p class="muted">${esc(last.text.slice(0,120))}</p><button class="secondary" onclick="openMessageThread('${last.studentId}','${last.teacherId}')">Ouvrir et répondre →</button></div>`;
 }).join(''):'<p class="muted">Aucune conversation pour le moment.</p>'}</div>`;
}
function openNewStudentMessage(){if(user.role!=='eleve')return;const teacherId=document.getElementById('msgTeacher')?.value;if(!messageTeachers.includes(teacherId))return;openMessageThread(user.id,teacherId)}
function openMessageThread(studentId,teacherId){
 if(!canViewThread(studentId,teacherId))return toast('Conversation non autorisée');
 const other=accounts.find(a=>a.id===(user.role==='eleve'?teacherId:studentId));
 const threadId=threadKey(studentId,teacherId);
 const msgs=(data.messages||[]).filter(m=>m.threadId===threadId).sort((a,b)=>a.at.localeCompare(b.at));
 modal({title:'💬 '+esc(other?.name||'Messagerie'),body:`<div style="max-height:48vh;overflow:auto">${msgs.length?msgs.map(m=>`<div class="word" style="margin:8px 0;border-left:4px solid ${m.from===user.id?'#087e4b':'#d83b49'}"><strong>${esc(accounts.find(a=>a.id===m.from)?.name||'Utilisateur')}</strong><span class="count"> · ${new Date(m.at).toLocaleString('fr-FR')}</span><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(m.text)}</p></div>`).join(''):'<p class="muted">Commence cette conversation.</p>'}</div><label>Répondre au message<textarea class="field" id="messageText" rows="4" maxlength="1500" placeholder="Écris ton message ici..."></textarea></label><button class="primary wide" onclick="sendThreadMessage('${studentId}','${teacherId}')">📨 Envoyer le message</button>`});
 const unread=msgs.filter(m=>m.to===user.id&&!m.readBy?.includes(user.id)).map(m=>m.id);
 if(unread.length&&window.scoliaCloudMarkMessagesRead)window.scoliaCloudMarkMessagesRead(unread,user.id).catch(e=>console.error(e));
}
async function sendThreadMessage(studentId,teacherId){
 if(messageSending||!canViewThread(studentId,teacherId))return;
 if(!window.scoliaCloudReady)return toast('Firebase non connecté');
 const body=document.getElementById('messageText')?.value.trim();if(!body)return toast('Écris ton message');
 const message={id:uid(),threadId:threadKey(studentId,teacherId),studentId,teacherId,from:user.id,to:user.role==='eleve'?teacherId:studentId,text:body.slice(0,1500),at:new Date().toISOString(),readBy:[user.id]};
 messageSending=true;
 try{await window.scoliaCloudSendMessage(message);closeModal();renderMessages();toast('Message envoyé !')}catch(e){console.error(e);toast('Envoi impossible : '+(e.code||e.message))}finally{messageSending=false}
}

function renderNotes(){let filters=`<div class="toolbar"><span class="pill-status">Semestre 2 🔒</span><select class="field" onchange="subject=this.value;render()">${subjects.map(s=>`<option ${subject===s?'selected':''}>${s}</option>`).join('')}</select></div>`;let c=document.getElementById('content');if(user.role==='prof'){c.innerHTML=filters+`<div class="card"><h2>Tableau des élèves</h2><p class="muted">Clique sur ✎ pour créer une évaluation pour un élève.</p><div class="grid">${students.map(s=>`<div class="student"><div class="studentname"><span class="avatar">${s.name[0]}</span><strong>${s.name}</strong></div><button class="pen" title="Évaluer ${s.name}" onclick="openEvalForm('${s.id}')">✎</button></div>`).join('')}</div></div>`+`<div class="card"><h2>Évaluations publiées</h2>${evalCards(data.evaluations.filter(e=>e.semester===semester&&e.subject===subject))}</div>`}else{c.innerHTML=filters+`<div class="card"><h2>Mes évaluations</h2><p class="muted">Clique sur une évaluation pour voir les compétences.</p>${evalCards(data.evaluations.filter(e=>e.student===user.id&&e.semester===semester&&e.subject===subject))}</div>`}}
function evalCards(list){if(!list.length)return '<p class="muted">Aucune évaluation pour le moment.</p>';return list.slice().reverse().map(e=>`<div class="eval" onclick="viewEval('${e.id}')"><strong>${esc(e.title)}</strong> <span class="muted">· ${esc(e.date)}</span>${user.role==='prof'?`<p class="count">${esc(students.find(s=>s.id===e.student)?.name||'')}</p>`:''}<div class="chips">${e.skills.map(x=>`<span class="chip ${x.level}">${esc(x.label)} · ${esc(levels[x.level])}</span>`).join('')}</div></div>`).join('')}
function modal(html){document.getElementById('modalHost').innerHTML=`<div class="modalwrap" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${html.title}</h2><button class="close" onclick="closeModal()">✕</button></div>${html.body}</div></div>`}function closeModal(){document.getElementById('modalHost').innerHTML=''}
function gradeValid(){if(selectedClass!=='6A')return null;const score=Number(document.getElementById('gradeScore')?.value),max=Number(document.getElementById('gradeMax')?.value),coef=Number(document.getElementById('gradeCoef')?.value);if(!Number.isFinite(score)||!Number.isFinite(max)||!Number.isFinite(coef)||max<=0||coef<=0||score<0||score>max||!document.getElementById('gradeScore')?.value.trim())return false;return {score,max,coef};}
function gradeFields(){return selectedClass==='6A'?`<h3>Note chiffrée — 6ème A</h3><div class="gradeinputs"><label>Note élève<input id="gradeScore" class="field" type="number" min="0" step="0.25" placeholder="Ex. 8" required></label><label>Sur combien ?<input id="gradeMax" class="field" type="number" min="1" step="0.25" value="20" required></label><label>Coefficient<input id="gradeCoef" class="field" type="number" min="0.25" step="0.25" value="1" required></label></div><p class="count">Les compétences ci-dessous sont liées à cette note.</p>`:''}
function gradeHtml(e){if(classOf(e.student)!=='6A'||!e.grade)return '';const g=e.grade;return `<span class="grade ${g.score<g.max/2?'low':''}">${esc(g.score)}/${esc(g.max)} · coef ${esc(g.coef)}</span>`}
function openEvalForm(student){if(user.role!=='prof'||!teacherAllowed(subject))return toast('Matière non autorisée');modal({title:'Nouvelle évaluation',body:`<p class="muted">Élève : ${esc(students.find(s=>s.id===student).name)} · ${esc(subject)} · Semestre ${semester}</p><label>Titre<input id="evalTitle" class="field" maxlength="100" placeholder="Ex. Évaluation de judo"></label><label>Date<input id="evalDate" class="field" type="date" value="${new Date().toISOString().slice(0,10)}"></label>${gradeFields()}<h3>Compétences</h3><div id="skillRows"></div><button class="secondary" onclick="addSkill()">+ Ajouter une compétence</button><p class="count">Maximum 10 compétences</p><button class="primary wide" onclick="publishEval('${student}')">Publier l'évaluation</button>`});addSkill()}
function addSkill(){let r=document.getElementById('skillRows');if(r.children.length>=10)return toast('Maximum 10 compétences');let d=document.createElement('div');d.className='competence';d.innerHTML=`<input class="field skillName" placeholder="Nom de la compétence" maxlength="120"><select class="field skillLevel">${Object.entries(levels).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}</select>`;r.append(d)}
function publishEval(student){if(!window.scoliaCloudReady)return toast('Attends la connexion à Firebase');if(user.role!=='prof'||!teacherAllowed(subject))return;let title=document.getElementById('evalTitle').value.trim(),date=document.getElementById('evalDate').value,skills=[...document.querySelectorAll('#skillRows .competence')].map(r=>({label:r.querySelector('.skillName').value.trim(),level:r.querySelector('.skillLevel').value})).filter(x=>x.label);if(!title||!date||!skills.length)return toast('Renseigne le titre, la date et une compétence');let grade=gradeValid();if(grade===false)return toast('Vérifie la note, le barème et le coefficient');data.evaluations.push({id:uid(),student,title,date,skills,semester:'2',subject,author:user.name,...(grade?{grade}:{})});notify('Nouvelle évaluation : '+title,student);save();closeModal();render();toast('Évaluation publiée !')}
function viewEval(id){let e=data.evaluations.find(x=>x.id===id);if(!e)return;if(user.role==='eleve'&&e.student===user.id&&!data.seenEvaluations?.[user.id]?.[e.id]){data.seenEvaluations??={};data.seenEvaluations[user.id]??={};data.seenEvaluations[user.id][e.id]=true;save();}modal({title:esc(e.title),body:`<p class="muted">${esc(e.subject)} · ${esc(e.date)} · Semestre ${esc(e.semester)}</p><p class="muted">Publié par ${esc(e.author)}</p>${e.skills.map(s=>`<div class="word"><strong>${esc(s.label)}</strong><div class="chips"><span class="chip ${s.level}">${esc(levels[s.level])}</span></div></div>`).join('')}`})}
function renderMots(){let c=document.getElementById('content');if(user.role==='prof'){c.innerHTML=`<div class="card"><div class="top"><h2>Mots envoyés</h2><button class="primary" onclick="openWordForm()">+ Nouveau mot</button></div>${wordCards(data.mots)}</div>`}else{c.innerHTML=`<div class="card"><h2>Mes mots</h2>${wordCards(data.mots.filter(w=>w.recipients.includes(user.id)))}</div>`}}
function wordCards(list){if(!list.length)return '<p class="muted">Aucun mot pour le moment.</p>';return list.slice().reverse().map(w=>`<div class="word"><strong>${esc(w.title)}</strong><p>${esc(w.message)}</p><span class="count">${esc(w.author)} · ${esc(w.date)}</span>${user.role==='prof'?`<div class="chips">${w.recipients.map(id=>`<span class="chip ${w.signed?.[id]?'vert':'jaune'}">${esc(students.find(s=>s.id===id)?.name)} : ${w.signed?.[id]?'Signé':'Non signé'}</span>`).join('')}</div>`:w.signed?.[user.id]?'<p class="chip vert" style="display:inline-block">✓ Signé</p>':`<p><button class="primary" onclick="signWord('${w.id}')">Signer</button></p>`}</div>`).join('')}
function openWordForm(){modal({title:'Nouveau mot',body:`<label>Titre<input class="field" id="wordTitle" maxlength="100" placeholder="Ex. Matériel de sport"></label><label>Message<textarea class="field" id="wordText" rows="5" maxlength="2000" placeholder="Écris le mot..."></textarea></label><strong>Élèves concernés</strong><div class="checks">${classStudents().map(s=>`<label><input type="checkbox" class="recipient" value="${s.id}"> ${esc(s.name)}</label>`).join('')}</div><button class="primary wide" onclick="publishWord()">Envoyer le mot</button>`})}
function publishWord(){if(!window.scoliaCloudReady)return toast('Attends la connexion à Firebase');let title=document.getElementById('wordTitle').value.trim(),message=document.getElementById('wordText').value.trim(),recipients=[...document.querySelectorAll('.recipient:checked')].map(x=>x.value);if(!title||!message||!recipients.length)return toast('Ajoute un titre, un message et au moins un élève');data.mots.push({id:uid(),title,message,recipients,signed:{},author:user.name,date:new Date().toLocaleDateString('fr-FR')});recipients.forEach(id=>notify('Nouveau mot : '+title,id));save();closeModal();render();toast('Mot envoyé !')}
function signWord(id){if(!window.scoliaCloudReady)return toast('Attends la connexion à Firebase');let w=data.mots.find(x=>x.id===id);if(!w||!w.recipients.includes(user.id))return;w.signed[user.id]=new Date().toISOString();accounts.filter(x=>x.role==='prof').forEach(p=>notify(user.name+' a signé le mot : '+w.title,p.id));save();render();toast('Mot signé !')}
function renderAlerts(){let list=data.alerts.filter(a=>a.recipient===user.id).reverse();document.getElementById('content').innerHTML=`<div class="card"><div class="top"><h2>Mes notifications</h2><button class="secondary" onclick="markRead()">Tout marquer comme lu</button></div>${list.length?list.map(a=>`<div class="word">${a.seen?'':'🔵 '}${esc(a.message)}<p class="count">${new Date(a.at).toLocaleString('fr-FR')}</p></div>`).join(''):'<p class="muted">Aucune notification.</p>'}</div>`}function markRead(){if(!window.scoliaCloudReady)return toast('Attends la connexion à Firebase');data.alerts.filter(a=>a.recipient===user.id).forEach(a=>a.seen=true);save();render()}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});

const colorOrder=['vert','bleu','jaune','rouge'];
const colorNames={vert:'Vert',bleu:'Bleu',jaune:'Jaune',rouge:'Rouge'};
function dots(skills){return '<div class="chips">'+skills.map(k=>`<span class="pastille ${k.level}" title="${esc(k.label)} : ${esc(levels[k.level])}" aria-label="${esc(k.label)} : ${esc(levels[k.level])}"></span>`).join('')+'</div>'}
function evalCards(list){if(!list.length)return '<p class="muted">Aucune évaluation pour le moment.</p>';return list.slice().reverse().map(e=>`<div class="eval" onclick="viewEval('${e.id}')"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><strong>${esc(e.title)}</strong><span class="muted" style="font-size:12px">${esc(e.date)}</span></div>${user.role==='prof'?`<p class="count">${esc(students.find(s=>s.id===e.student)?.name||'')}</p>`:''}${dots(e.skills)}</div>`).join('')}
function teacherAllowed(mat){if(!user||user.role!=='prof')return false;if(isAdmin())return subjects.includes(mat);if(user.id==='elsahraoui')return mat==='Sport';if(user.id==='gueblaoui')return mat==='Football'||mat==='Technologie';return mat==='Musique'||mat==='Arts plastiques'}
function studentSemester(){return '2'}
function released(){let w=currentWindow();return w.active&&!!w.end&&new Date()>new Date(w.end+'T23:59:59')}
function dateFR(s){return s?new Date(s+'T12:00:00').toLocaleDateString('fr-FR'):'—'}
function renderNotes(){
 const c=document.getElementById('content'),all=data.evaluations.filter(e=>e.semester===semester&&classOf(e.student)===selectedClass),teachers={'Musique':'M. Sahli','Arts plastiques':'M. Sahli','Sport':'M. El Sahraoui','Football':'M. Gueblaoui','Technologie':'M. Gueblaoui'};
 const semesterBar=`<div class="toolbar"><label style="display:flex;align-items:center;gap:7px">Classe ${user.role==='prof'?`<select class="field" style="margin:0;min-width:135px" onchange="selectedClass=this.value;semester='2';render()"><option value="6A" ${selectedClass==='6A'?'selected':''}>6ème A</option><option value="6B" ${selectedClass==='6B'?'selected':''}>6ème B</option></select>`:`<strong>${classNames[classOf(user.id)]}</strong>`}</label><span class="pill-status">Semestre 2 🔒</span></div>`;
 if(user.role==='prof'){
  const allowed=subjects.filter(teacherAllowed);if(!allowed.includes(subject))subject=allowed[0];const chosen=all.filter(e=>e.subject===subject),groups=new Map();chosen.filter(e=>e.groupId).forEach(e=>{if(!groups.has(e.groupId))groups.set(e.groupId,[]);groups.get(e.groupId).push(e)});
  c.innerHTML=semesterBar+`<div class="card"><h2>Mes matières</h2><div class="subject-list">${allowed.map(s=>`<button class="subject-item ${subject===s?'chosen':''}" onclick="subject='${s}';render()"><span><strong>${esc(s)}</strong><small>${esc(teachers[s])}</small></span><span>›</span></button>`).join('')}</div></div><div class="card"><div class="top" style="flex-wrap:wrap"><div><h2>${esc(subject)} — ${classNames[selectedClass]}</h2><p class="muted">${esc(teachers[subject])} · ${classTeacher(selectedClass)} (professeur principal) · Semestre ${semester}</p></div><button class="primary bigpen" onclick="openBulkEval()">✎ Évaluer toute la classe</button></div><div class="rosterwrap"><table class="roster"><thead><tr><th>Élève</th><th>Résultats</th><th>Stylo</th></tr></thead><tbody>${classStudents().map(st=>`<tr><td><strong>${esc(st.name)}</strong></td><td>${chosen.filter(e=>e.student===st.id).map(e=>`<button class="mark-unit" onclick="viewEval('${e.id}')" title="${esc(e.title)}">${gradeHtml(e)}${dots(e.skills)}</button>${canDeleteEvaluation(e)?`<button class="danger" title="Supprimer cette note" onclick="deleteEvaluation('${e.id}')">🗑️</button>`:''}`).join('')||'—'}</td><td><button class="pen" onclick="openEvalForm('${st.id}')">✎</button></td></tr>`).join('')}</tbody></table></div></div><div class="card"><h2>Résultats de la classe</h2>${[...groups.values()].reverse().map(classReport).join('')||'<p class="muted">Les statistiques apparaîtront après une évaluation de classe.</p>'}</div>`;
 }else{
  const own=data.evaluations.filter(e=>e.student===user.id&&e.semester===semester);
  c.innerHTML=semesterBar+`<div class="card" style="padding:0;overflow:hidden"><div class="rosterwrap"><table class="marks-table"><thead><tr><th>DISCIPLINES</th><th>ÉVALUATIONS</th></tr></thead><tbody>${['Arts plastiques','Musique','Sport','Football','Technologie'].map(mat=>`<tr><td><strong>${mat==='Musique'?'ÉDUCATION MUSICALE':mat.toUpperCase()}</strong><span class="teacher">${teachers[mat]}</span></td><td><div class="marks">${own.filter(e=>e.subject===mat).map(e=>`<button class="mark-unit" onclick="viewEval('${e.id}')" title="${esc(e.title)}">${gradeHtml(e)}${dots(e.skills)}<span class="mark-title">${esc(e.title)}</span>${newMark(e)}</button>`).join('')||'<span class="muted">—</span>'}</div></td></tr>`).join('')}</tbody></table></div></div>${released()?`<div class="card"><h2>Appréciations du semestre 2</h2>${appreciationReadOnly(user.id)}</div>`:''}`;
 }
}
function canDeleteEvaluation(e){return user?.role==='prof'&&(isAdmin()||e.author===user.name||((data.quizzes||[]).some(q=>q.id===e.quizId&&(isAdmin()||q.authorId===user.id))))}
async function deleteEvaluation(id){
 const e=data.evaluations.find(x=>x.id===id);
 if(!e||!canDeleteEvaluation(e)||!window.scoliaCloudReady)return toast('Suppression non autorisée');
 if(!confirm('Supprimer définitivement la note « '+e.title+' » de '+(students.find(s=>s.id===e.student)?.name||'cet élève')+' ?'))return;
 try{await window.scoliaCloudDeleteEvaluation(id,user.id);closeModal();render();toast('Note supprimée de Firebase')}
 catch(err){console.error(err);toast('Suppression impossible : '+(err.code||err.message))}
}
function classReport(g){let first=g[0],total=g.reduce((n,e)=>n+e.skills.length,0),count={vert:0,bleu:0,jaune:0,rouge:0};g.forEach(e=>e.skills.forEach(k=>{if(count[k.level]!==undefined)count[k.level]++}));let complete=classStudents().every(s=>g.some(e=>e.student===s.id&&e.skills.length));return `<div class="word"><div style="display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap"><strong>${esc(first.title)}</strong><span class="count">${g.length}/${classStudents().length} élèves évalués ${complete?'✓ Complet':'· En cours'}</span></div>${colorOrder.map(k=>{let pct=total?Math.round(100*count[k]/total):0;return `<div class="statrow"><span class="skillline"><span class="pastille ${k}"></span>${colorNames[k]}</span><div class="barbg"><div class="barfill ${k}" style="width:${pct}%"></div></div><strong>${pct}%</strong></div>`}).join('')}<p class="count">Pourcentages calculés sur ${total} compétences attribuées.</p></div>`}
function openBulkEval(){if(user.role!=='prof'||!teacherAllowed(subject))return toast('Matière non autorisée');modal({title:'✎ Évaluation de la '+classNames[selectedClass],body:`<p class="muted">${esc(subject)} · Semestre ${semester} · ${classStudents().length} élèves</p><label>Titre de l'évaluation<input id="bulkTitle" class="field" maxlength="100" placeholder="Ex. Judo : techniques de base"></label><label>Date<input id="bulkDate" class="field" type="date" value="${new Date().toLocaleDateString('en-CA')}"></label><h3>Compétences communes</h3><div id="bulkSkills"></div><button class="secondary" onclick="addBulkSkill()">+ Ajouter une compétence</button><p class="count">Jusqu'à 10 compétences. Choisis ensuite la couleur pour chaque élève.</p><div id="bulkRoster"></div><button class="primary wide" onclick="publishBulk()" style="margin-top:18px">Publier pour la classe</button>`});addBulkSkill();renderBulkRoster()}

function publishBulk(){if(!window.scoliaCloudReady)return toast('Attends la connexion à Firebase');if(user.role!=='prof'||!teacherAllowed(subject))return;let title=document.getElementById('bulkTitle').value.trim(),date=document.getElementById('bulkDate').value,skills=[...document.querySelectorAll('.bulkSkill')].map(x=>x.value.trim());if(!title||!date||!skills.length||skills.some(x=>!x))return toast('Indique un titre, une date et le nom de chaque compétence');let entries=classStudents().map(st=>({student:st.id,skills:skills.map((label,i)=>({label,level:document.querySelector(`select[data-student="${st.id}"][data-skill="${i}"]`)?.value})).filter(x=>x.level)}));if(entries.some(e=>!e.skills.length))return toast('Attribue au moins une pastille à chaque élève');if(selectedClass==='6A'){for(const e of entries){const v=t=>document.querySelector(`[data-grade-student="${e.student}"][data-grade-type="${t}"]`)?.value;const score=Number(v('score')),max=Number(v('max')),coef=Number(v('coef'));if(!v('score')||!Number.isFinite(score)||!Number.isFinite(max)||!Number.isFinite(coef)||score<0||max<=0||score>max||coef<=0)return toast('Vérifie les notes, barèmes et coefficients des 3 élèves');e.grade={score,max,coef}}}let groupId=uid();entries.forEach(e=>{data.evaluations.push({id:uid(),groupId,student:e.student,title,date,skills:e.skills,semester:'2',subject,author:user.name,...(e.grade?{grade:e.grade}:{})});notify('Nouvelle évaluation : '+title,e.student)});save();closeModal();render();toast('Évaluation publiée pour la classe !')}
function viewEval(id){let e=data.evaluations.find(x=>x.id===id);if(!e)return;modal({title:esc(e.title),body:`<p class="muted">${esc(e.subject)} · ${esc(e.date)} · Semestre ${esc(e.semester)}</p><p class="muted">${user.role==='prof'?esc(students.find(s=>s.id===e.student)?.name)+' · ':''}Publié par ${esc(e.author)}</p>${gradeHtml(e)?`<div class="gradebox">Note : ${gradeHtml(e)}</div>`:''}${e.skills.map(s=>`<div class="word"><div class="skillline"><span class="pastille ${s.level}"></span><strong>${esc(s.label)}</strong></div><span class="count">${esc(levels[s.level])}</span></div>`).join('')}${canDeleteEvaluation(e)?`<button class="danger" onclick="deleteEvaluation('${e.id}')">🗑️ Supprimer cette note</button>`:''}`})}

n>`:''}</div>`).join('')}</div></div>`}

// Bulletins calculés depuis les évaluations et appréciations déjà synchronisées dans Firestore.
let bulletinSemester='2',bulletinStudent='';
function bulletinFor(id,sem){
 const st=students.find(x=>x.id===id);if(!st)return '<p>Élève introuvable.</p>';
 const cls=classOf(id),list=data.evaluations.filter(e=>e.student===id&&String(e.semester)===String(sem));
 const teacherBySubject={'Sport':'M. El Sahraoui','Musique':'M. Sahli','Arts plastiques':'M. Sahli','Football':'M. Gueblaoui','Technologie':'M. Gueblaoui'};
 const rows=subjects.map(mat=>{
   const evaluations=list.filter(e=>e.subject===mat),count={vert:0,bleu:0,jaune:0,rouge:0};
   evaluations.forEach(e=>(e.skills||[]).forEach(sk=>{if(count[sk.level]!==undefined)count[sk.level]++}));
   const total=Object.values(count).reduce((a,b)=>a+b,0);const graded=evaluations.filter(e=>e.grade&&e.grade.max>0&&e.grade.coef>0);const weight=graded.reduce((n,e)=>n+e.grade.coef,0);const average=weight?graded.reduce((n,e)=>n+20*e.grade.score/e.grade.max*e.grade.coef,0)/weight:null;
   const chips=total?colorOrder.map(k=>count[k]?`<span class="bulletin-legend"><span class="pastille ${k}"></span>${count[k]}</span>`:'').join(''):'<span class="muted">Non évalué</span>';
   return `<tr><td><strong>${esc(mat)}</strong><small>${esc(teacherBySubject[mat])}</small></td><td>${evaluations.length}</td>${cls==='6A'?`<td>${average===null?'—':`<span class="grade ${average<10?'low':''}">${average.toFixed(2).replace('.',',')}/20</span>`}</td>`:''}<td><div class="bulletin-colors">${chips}</div></td></tr>`;
 }).join('');
 const teachers={'elsahraoui':'M. El Sahraoui','sahli':'M. Sahli','sahliremplacant':'M. Sahli remplaçant','gueblaoui':'M. Gueblaoui'};
 const appreciations=Object.entries(teachers).map(([tid,name])=>({name,value:data.appreciations?.[appKey(sem,tid,id)]})).filter(x=>x.value);
 const appHtml=appreciations.length?appreciations.map(x=>`<div class="bulletin-app"><strong>${esc(x.name)}</strong><p>${esc(x.value)}</p></div>`).join(''):'<p class="muted">Aucune appréciation enregistrée pour ce semestre.</p>';
 return `<article class="bulletin-page" id="bulletinPaper"><div class="bulletin-head"><div class="bulletin-emblem">S</div><div><h2>SCOLIA · BULLETIN SEMESTRIEL</h2><p>Année scolaire 2026–2027 · Semestre ${esc(sem)}</p></div></div><div class="bulletin-meta"><div><span>ÉLÈVE</span><strong>${esc(st.name)}</strong></div><div><span>CLASSE</span><strong>${esc(classNames[cls])}</strong></div><div><span>PROFESSEUR PRINCIPAL</span><strong>${esc(classTeacher(cls))}</strong></div></div><h3>Résultats et compétences</h3><table class="bulletin-table"><thead><tr><th>Matière</th><th>Évaluations</th>${cls==='6A'?'<th>Moyenne</th>':''}<th>Compétences</th></tr></thead><tbody>${rows}</tbody></table><p class="bulletin-hint">🟢 Très bonne maîtrise · 🔵 Maîtrise satisfaisante · 🟡 Maîtrise fragile · 🔴 Maîtrise insuffisante</p><h3>Appréciations des professeurs</h3>${appHtml}<div class="bulletin-footer">Bulletin de démonstration généré à partir des données Scolia · ${esc(classNames[cls])}</div></article>`;
}
function renderBulletins(){
 const isProf=user.role==='prof';
 if(!isProf){bulletinStudent=user.id;selectedClass=classOf(user.id)}
 else if(!classStudents().some(s=>s.id===bulletinStudent))bulletinStudent=classStudents()[0]?.id||'';
 const toolbar=`<div class="toolbar bulletin-toolbar">${isProf?`<label>Classe<select class="field" onchange="selectedClass=this.value;bulletinStudent='';render()"><option value="6A" ${selectedClass==='6A'?'selected':''}>6ème A</option><option value="6B" ${selectedClass==='6B'?'selected':''}>6ème B</option></select></label><label>Élève<select class="field" onchange="bulletinStudent=this.value;render()">${classStudents().map(st=>`<option value="${st.id}" ${st.id===bulletinStudent?'selected':''}>${esc(st.name)}</option>`).join('')}</select></label>`:''}<span class="pill-status">Semestre 2 🔒</span><button class="secondary bulletin-print" onclick="window.print()">🖨️ Imprimer / PDF</button></div>`;
 document.getElementById('content').innerHTML=toolbar+`<p class="muted bulletin-intro">Bulletin ${isProf?'prévisualisé':'consultable'} à partir des évaluations et appréciations enregistrées dans Firebase. ${selectedClass==='6A'?'Moyennes pondérées par coefficient sur 20.':'Classe évaluée uniquement par compétences.'}</p>`+bulletinFor(bulletinStudent,'2');

function newCourse(){

 modal({title:'📚 Nouveau cours',body:`<label>Titre du cours<input id="courseTitle" class="field" maxlength="120" placeholder="Ex. Les règles du judo"></label><label>Matière<select id="courseSubject" class="field">${subjects.filter(teacherAllowed).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label><p class="muted">Classe : ${esc(classNames[selectedClass])} · Semestre ${esc(semester)}</p><label>Contenu de la leçon<textarea id="courseBody" class="field" rows="12" maxlength="15000" placeholder="Écris ton cours ici : définitions, exemples, consignes..."></textarea></label><div class="grid"><label>Couleur du texte<select id="courseColor" class="field"><option value="#173a2c">Vert foncé</option><option value="#087e4b">Vert algérien</option><option value="#c92f43">Rouge</option><option value="#2856b5">Bleu</option><option value="#212121">Noir</option></select></label><label>Couleur du fond<select id="courseBackground" class="field"><option value="#ffffff">Blanc</option><option value="#e8f8ed">Vert clair</option><option value="#fff0f1">Rose clair</option><option value="#edf2ff">Bleu clair</option><option value="#fff6d9">Jaune clair</option></select></label></div><label>Fichier PDF à joindre (facultatif, 180 Ko maximum)<input id="coursePDF" class="field" type="file" accept="application/pdf"></label><p class="muted">Le PDF est joint au cours et peut être ouvert par les élèves. Pour les gros PDF, un stockage de fichiers sécurisé sera nécessaire.</p><button class="primary wide" onclick="publishCourse()">Publier le cours</button>`});

let courseSaving=false;
async function publishCourse(){
 if(user.role!=='prof'||!window.scoliaCloudReady||courseSaving)return;
 const title=document.getElementById('courseTitle')?.value.trim(),body=document.getElementById('courseBody')?.value.trim(),subject=document.getElementById('courseSubject')?.value;
 if(!title||!body||!teacherAllowed(subject))return toast('Complète le titre, la matière et la leçon');
 let pdf='',pdfName='';
 const file=document.getElementById('coursePDF')?.files?.[0];
 if(file){
  if(file.type!=='application/pdf'||file.size>180000)return toast('PDF uniquement, maximum 180 Ko');
  try{pdf=await fileAsDataURL(file);pdfName=file.name.slice(0,100)}catch{return toast('Lecture du PDF impossible')}
 }
 const color=document.getElementById('courseColor').value,background=document.getElementById('courseBackground').value;
 const entry={id:uid(),title,body,color,background,pdf,pdfName,subject,classId:selectedClass,semester:'2',author:user.name,authorId:user.id,date:new Date().toISOString().slice(0,10)};
 if(JSON.stringify(entry).length>350000)return toast('Cours trop volumineux pour Firebase');
 courseSaving=true;
 try{await window.scoliaCloudAddCourse(entry);closeModal();toast('Cours publié !');renderCours()}catch(e){console.error(e);toast('Erreur Firebase : '+(e.code||e.message))}finally{courseSaving=false}
}
function openCourse(id){

function safeMediaUrl(v){
 if(!v)return true;
 return /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v)
 || /^data:audio\/(mpeg|ogg|wav|mp4|webm);base64,[A-Za-z0-9+/=]+$/.test(v)
 || (v.length<=1000&&/^https:\/\//.test(v)); // anciens QCM compatibles
}
function fileAsDataURL(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('Lecture impossible'));reader.readAsDataURL(file)})}
async function uploadQuizMedia(i,type,input){
 const file=input.files?.[0];if(!file)return;
 if(type==='image'&&!['image/jpeg','image/png','image/webp'].includes(file.type))return toast('Image JPG, PNG ou WEBP uniquement');
 if(type==='audio'&&!['audio/mpeg','audio/ogg','audio/wav','audio/mp4','audio/webm'].includes(file.type))return toast('Format audio non pris en charge');
 if(type==='audio'&&file.size>90000){input.value='';return toast('Son trop volumineux : maximum 90 Ko')}
 if(type==='image'&&file.size>6000000){input.value='';return toast('Image trop volumineuse')}
 syncQuizDraft();
 try{
  if(type==='audio'){quizDraft[i].audio=await fileAsDataURL(file)}
  else {
   const url=await fileAsDataURL(file);
   const img=new Image();img.src=url;await img.decode();
   const scale=Math.min(1,720/img.width,720/img.height);
   const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
   canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
   let compressed=canvas.toDataURL('image/jpeg',0.66);
   if(compressed.length>135000)compressed=canvas.toDataURL('image/jpeg',0.35);
   if(compressed.length>135000)throw Error('Image trop grande après compression');
   quizDraft[i].image=compressed;
  }
  renderQuizEditor();toast('Fichier ajouté à la question');
 }catch(e){console.error(e);toast('Impossible de charger ce fichier')}
}

  max+=Number(item.points);if(ok)points+=Number(item.points);
  return `<div class="word"><strong>Question ${i+1} — ${esc(item.text)}</strong><div class="review-answer ${ok?'good':'bad'}">Réponse de l'élève : ${esc((picked===null||picked===undefined?'Sans réponse':item.answers[picked]??'Sans réponse'))} ${ok?'✓':'✗'}</div><div class="review-answer good">Bonne réponse : ${esc(item.answers[correct])}</div><span class="count">${ok?Number(item.points):0} / ${Number(item.points)} point(s)</span></div>`;
 }).join('');
 const g=ev?.grade;
 modal({title:'Copie de '+esc(st?.name||a.student),body:`<p>${esc(q.title)} · ${esc(q.subject)}</p><p><strong>Résultat du QCM : ${points}/${max}</strong></p>${g?`<p>Note enregistrée : <strong>${esc(g.score)}/${esc(g.max)}</strong> · Coef. ${esc(g.coef)}</p><button class="primary" onclick="editQuizGrade('${ev.id}')">✎ Changer la note</button>`:`<p>Classe 6ème B : évaluation par compétences uniquement.</p>`}<h3>Réponses de l'élève</h3>${rows}<button class="secondary" onclick="showQuizDetails('${quizId}')">← Retour aux copies</button>`});
}
function editQuizGrade(evaluationId){
 if(user.role!=='prof')return;
 const e=data.evaluations.find(x=>x.id===evaluationId);
 if(!e?.grade||classOf(e.student)!=='6A'||!(data.quizzes||[]).some(q=>q.id===e.quizId&&(isAdmin()||q.authorId===user.id)))return toast('Modification réservée aux notes de 6ème A');
 modal({title:'✎ Corriger la note',body:`<p><strong>${esc(students.find(s=>s.id===e.student)?.name||'')}</strong> · ${esc(e.title)}</p><p class="muted">Note précédente : ${esc(e.grade.score)}/${esc(e.grade.max)}. Les compétences calculées automatiquement restent inchangées.</p><label>Nouvelle note<input id="editScore" class="field" type="number" min="0" max="${esc(e.grade.max)}" step="0.25" value="${esc(e.grade.score)}"></label><label>Coefficient<input id="editCoef" class="field" type="number" min="0.25" max="20" step="0.25" value="${esc(e.grade.coef)}"></label><button class="primary wide" onclick="saveQuizGrade('${evaluationId}')">Enregistrer la correction</button>`});
}
async function saveQuizGrade(evaluationId){
 if(user.role!=='prof'||!window.scoliaCloudReady||quizSaving)return;
 const score=Number(document.getElementById('editScore')?.value),coef=Number(document.getElementById('editCoef')?.value),reason='';
 const e=data.evaluations.find(x=>x.id===evaluationId);
 if(!e?.grade||!(data.quizzes||[]).some(q=>q.id===e.quizId&&(isAdmin()||q.authorId===user.id))||!Number.isFinite(score)||score<0||score>e.grade.max||!Number.isFinite(coef)||coef<=0||coef>20)return toast('Vérifie la note, le coefficient et le motif');
 quizSaving=true;
 try{
  await window.scoliaCloudEditGrade(evaluationId,{score,coef,reason,editor:user.name,at:new Date().toISOString()});
  closeModal();toast('Note corrigée dans Firebase');
 }catch(err){console.error(err);toast('Erreur Firebase : '+(err.code||err.message))}
 finally{quizSaving=false}
}
function showQuizStats(id){
 if(user.role!=='prof')return;const q=(data.quizzes||[]).find(x=>x.id===id&&(isAdmin()||x.authorId===user.id));if(!q)return;
 const attempts=(data.quizAttempts||[]).filter(a=>a.quizId===id&&!a.superseded),studentsCount=students.filter(st=>classOf(st.id)===q.classId).length;
 const points=q.questions.reduce((n,x)=>n+Number(x.points),0),scores=attempts.map(a=>q.questions.reduce((n,item,i)=>n+(a.answers[i]!==null&&a.answers[i]!==undefined&&Number(a.answers[i])===Number(item.correct)?Number(item.points):0),0));
 const mean=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):'—';
 const rows=q.questions.map((item,i)=>{const right=attempts.filter(a=>a.answers[i]!==null&&a.answers[i]!==undefined&&Number(a.answers[i])===Number(item.correct)).length;return `<div class="word"><strong>${i+1}. ${esc(item.text)}</strong><p>${right}/${attempts.length} bonne(s) réponse(s) · ${attempts.length?Math.round(right/attempts.length*100):0}%</p></div>`}).join('');
 modal({title:'📊 Statistiques — '+esc(q.title),body:`<p>Participants : <strong>${attempts.length}/${studentsCount}</strong></p><p>Moyenne : <strong>${mean}${scores.length?'/'+points:''}</strong></p><h3>Réussite par question</h3>${rows}<button class="secondary" onclick="showQuizDetails('${id}')">← Retour aux copies</button>`});
}
async function grantQuizRetry(quizId,studentId){
 if(user.role!=='prof'||!window.scoliaCloudReady)return;
 const q=(data.quizzes||[]).find(x=>x.id===quizId&&(isAdmin()||x.authorId===user.id));
 if(!q||classOf(studentId)!==q.classId)return;
 if(!confirm('Autoriser une nouvelle tentative pour cet élève ? La nouvelle note remplacera la précédente.'))return;
 try{await window.scoliaCloudGrantRetry(quizId,studentId,user.id);toast('Rattrapage autorisé');closeModal()}catch(e){toast('Erreur : '+e.message)}
}
async function deleteQuiz(id){if(user.role!=='prof'||!(data.quizzes||[]).some(q=>q.id===id&&(isAdmin()||q.authorId===user.id))||!confirm('Masquer ce QCM ? Les notes déjà obtenues seront conservées.'))return;try{await window.scoliaCloudDeleteQuiz(id);toast('QCM masqué')}catch(e){toast('Erreur Firebase : '+e.message)}}
</script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getFirestore,doc,onSnapshot,runTransaction} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const config={apiKey:'AIzaSyCkxjEStQogXLmy9AdVMmNR5zLPOesAcH0',authDomain:'note-projet-6a278.firebaseapp.com',projectId:'note-projet-6a278',storageBucket:'note-projet-6a278.firebasestorage.app',messagingSenderId:'248485841685',appId:'1:248485841685:web:c76388066f695a367e371c'};
const db=getFirestore(initializeApp(config));const ref=doc(db,'scolia_demo','shared');
window.scoliaCloudReady=false;
window.scoliaCloudConnection=entry=>runTransaction(db,async tx=>{
 const snap=await tx.get(ref);const old=snap.exists()?(snap.data().state||{}):{};
 const list=[...(old.connectionLogs||[])];const pos=list.findIndex(x=>x.id===entry.id);
 if(pos>=0)list[pos]={...list[pos],last:entry.last,closed:entry.closed};
 else if(entry.start)list.push(entry);
 tx.set(ref,{state:{...old,connectionLogs:list.slice(-100)}});
});
window.scoliaCloudSave=async state=>runTransaction(db,async tx=>{
 const snapshot=await tx.get(ref);
 const old=snapshot.exists()?(snapshot.data().state||{}):{};
 const mergeById=(a,b)=>[...new Map([...(a||[]),...(b||[])].map(x=>[x.id,x])).values()];
 const merged={
  evaluations:mergeById(old.evaluations,state.evaluations),
  mots:mergeById(old.mots,state.mots),
  alerts:mergeById(old.alerts,state.alerts),
  appreciations:{...(old.appreciations||{}),...(state.appreciations||{})},
  appWindow:state.appWindow||old.appWindow||{active:false,start:'',end:'',semester:'1'},
  appWindows:{...(old.appWindows||{}),...(state.appWindows||{})},
  courses:mergeById(old.courses,state.courses),
  quizzes:mergeById(old.quizzes,state.quizzes),
  quizAttempts:mergeById(old.quizAttempts,state.quizAttempts),
  messages:mergeById(old.messages,state.messages),
  archiveAccess:old.archiveAccess||{},
  connectionLogs:old.connectionLogs||[],
  seenEvaluations:Object.fromEntries([...new Set([...Object.keys(old.seenEvaluations||{}),...Object.keys(state.seenEvaluations||{})])].map(k=>[k,{...(old.seenEvaluations?.[k]||{}),...(state.seenEvaluations?.[k]||{})}]))
 };
 tx.set(ref,{state:merged});
});

window.scoliaCloudSendMessage=entry=>runTransaction(db,async tx=>{
 const snap=await tx.get(ref),old=snap.exists()?(snap.data().state||{}):{};
 const list=old.messages||[];if(list.length>=400)throw Error('Limite de messages atteinte');
 tx.set(ref,{state:{...old,messages:[...list,entry]}});
});
window.scoliaCloudMarkMessagesRead=(ids,reader)=>runTransaction(db,async tx=>{
 const snap=await tx.get(ref),old=snap.exists()?(snap.data().state||{}):{};
 tx.set(ref,{state:{...old,messages:(old.messages||[]).map(m=>ids.includes(m.id)&&m.to===reader?{...m,readBy:[...new Set([...(m.readBy||[]),reader])]}:m)}});
});
window.scoliaCloudAddCourse=entry=>runTransaction(db,async tx=>{
 const snap=await tx.get(ref),old=snap.exists()?(snap.data().state||{}):{};
 if((old.courses||[]).length>=100)throw Error('Limite de 100 cours atteinte');
 tx.set(ref,{state:{...old,courses:[...(old.courses||[]),entry]}});
});
window.scoliaCloudDeleteCourse=id=>runTransaction(db,async tx=>{
 const snap=await tx.get(ref),old=snap.exists()?(snap.data().state||{}):{};
 tx.set(ref,{state:{...old,courses:(old.courses||[]).map(c=>c.id===id?{...c,deleted:true}:c)}});
});
window.scoliaCloudAddQuiz=entry=>runTransaction(db,async tx=>{
 const snap=await tx.get(ref),old=snap.exists()?(snap.data().state||{}):{};
 if((old.quizzes||[]).length>=80)throw Error('Limite de 80 QCM atteinte pour la démonstration');
 tx.set(ref,{state:{...old,quizzes:[...(old.quizzes||[]),entry]}});
});
window.scoliaCloudSubmitQuiz=(attempt,evaluation)=>runTransaction(db,async tx=>{
 const snap=await tx.get(ref),old=snap.exists()?(snap.data().state||{}):{};
 const previous=(old.quizAttempts||[]).filter(a=>a.quizId===attempt.quizId&&a.student===attempt.student&&!a.superseded);
 const quiz=(old.quizzes||[]).find(q=>q.id===attempt.quizId&&!q.deleted&&q.published);
 if(!quiz)throw Error('QCM non disponible');
 if(previous.length&&!(quiz.retries||[]).includes(attempt.student))throw Error('QCM déjà terminé');
 const now=Date.now();if((quiz.opensAt&&now<Date.parse(quiz.opensAt))||(quiz.closesAt&&now>Date.parse(quiz.closesAt)))throw Error('Évaluation fermée');
 const alerts=[...(old.alerts||[]),{id:attempt.id+'alert',recipient:attempt.student,message:'Nouvelle évaluation QCM : '+quiz.title,at:attempt.at,seen:false}];
 tx.set(ref,{state:{...old,quizAttempts:[...(old.quizAttempts||[]).map(a=>previous.some(p=>p.id===a.id)?{...a,superseded:true}:a),attempt],evaluations:[...(old.evaluations||[]).filter(e=>!previous.some(p=>p.evaluationId===e.id)),evaluation],quizzes:(old.quizzes||[]).map(q=>q.id===quiz.id?{...q,retries:(q.retries||[]).filter(st=>st!==attempt.student)}:q),alerts}});
});
window.scoliaCloudEditGrade=(id,change)=>runTransaction(db,async tx=>{
 const snap=await tx.get(ref),old=snap.exists()?(snap.data().state||{}):{};
 const evaluation=(old.evaluations||[]).find(e=>e.id===id);
 if(!evaluation?.grade||!evaluation.quizId)throw Error('Note QCM introuvable');
 const updated=(old.evaluations||[]).map(e=>e.id!==id?e:{
  ...e,grade:{...e.grade,score:change.score,coef:change.coef},
  correctionHistory:[...(e.correctionHistory||[]),{oldScore:e.grade.score,newScore:change.score,oldCoef:e.grade.coef,newCoef:change.coef,reason:change.reason,editor:change.editor,at:change.at}]
 });
 tx.set(ref,{state:{...old,evaluations:updated}});
});
window.scoliaCloudGrantRetry=(id,studentId,authorId)=>runTransaction(db,async tx=>{
 const snap=await tx.get(ref),old=snap.exists()?(snap.data().state||{}):{};
 const q=(old.quizzes||[]).find(q=>q.id===id&&q.authorId===authorId);
 if(!q)throw Error('Évaluation introuvable');
 tx.set(ref,{state:{...old,quizzes:(old.quizzes||[]).map(x=>x.id===id?{...x,retries:[...new Set([...(x.retries||[]),studentId])]}:x)}});
});
window.scoliaCloudDeleteQuiz=id=>runTransaction(db,async tx=>{
 const snap=await tx.get(ref),old=snap.exists()?(snap.data().state||{}):{};
 tx.set(ref,{state:{...old,quizzes:(old.quizzes||[]).map(q=>q.id===id?{...q,deleted:true}:q)}});
});
window.scoliaCloudDeleteEvaluation=(id,actorId)=>runTransaction(db,async tx=>{
 const snap=await tx.get(ref),old=snap.exists()?(snap.data().state||{}):{};
 const e=(old.evaluations||[]).find(x=>x.id===id);
 if(!e)throw Error('Note introuvable');
 const actor=accounts.find(a=>a.id===actorId);
 const ownQuiz=(old.quizzes||[]).some(q=>q.id===e.quizId&&q.authorId===actorId);
 if(actor?.role!=='prof'||!(actorId==='elsahraoui'||e.author===actor.name||ownQuiz))throw Error('Suppression non autorisée');
 tx.set(ref,{state:{...old,evaluations:(old.evaluations||[]).filter(x=>x.id!==id),deletedEvaluationLog:[...(old.deletedEvaluationLog||[]).slice(-99),{id,student:e.student,title:e.title,by:actorId,at:new Date().toISOString()}]}});
});

window.scoliaCloudSetArchiveAccess=(teacherId,enabled)=>runTransaction(db,async tx=>{
 const snap=await tx.get(ref),old=snap.exists()?(snap.data().state||{}):{};
 if(!accounts.some(a=>a.id===teacherId&&a.role==='prof'&&a.id!=='elsahraoui'))throw Error('Professeur inconnu');
 tx.set(ref,{state:{...old,archiveAccess:{...(old.archiveAccess||{}),[teacherId]:Boolean(enabled)}}});
});
window.scoliaCloudCopyArchive=ids=>runTransaction(db,async tx=>{
 const snap=await tx.get(ref),old=snap.exists()?(snap.data().state||{}):{};
 const list=old.evaluations||[],unique=[...new Set(ids)];
 if(unique.length>40)throw Error('Maximum 40 évaluations à la fois');
 const copies=[];
 for(const id of unique){
  const original=list.find(e=>e.id===id&&String(e.semester)==='1');
  if(!original)throw Error('Évaluation du semestre 1 introuvable');
  if(list.some(e=>e.copiedFrom===id&&String(e.semester)==='2'))continue;
  const newId='archive_'+id+'_'+Math.random().toString(36).slice(2,9);
  copies.push({...original,id:newId,semester:'2',copiedFrom:id,copyAt:new Date().toISOString(),copyBy:'elsahraoui',groupId:null,quizId:null});
 }
 if(copies.length)tx.set(ref,{state:{...old,evaluations:[...list,...copies]}});
 return copies.length;
});

onSnapshot(ref,s=>{
 const remote=s.exists()?s.data().state:null;
 if(remote){data={evaluations:[],mots:[],alerts:[],appreciations:{},appWindow:{active:false,start:'',end:'',semester:'1'},...remote};}
 window.scoliaCloudReady=true;
 if(user&&!connectionId)startConnectionLog();
 if(user&&!quizSaving&&activeQuizId===null&&!document.getElementById('quizEditor'))render();
},e=>{window.scoliaCloudReady=false;console.error(e);toast('Firebase bloqué : vérifie les règles Firestore')});
</script><script>if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));</script></body></html>
