<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3159d9"><title>Scolia</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#17213b;background:#f4f7fd}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top left,#c4d5ff,transparent 50%),#f5f7ff}.panel{background:white;border-radius:24px;box-shadow:0 16px 55px #233b7d16;padding:28px;width:min(100%,440px)}.logo{display:inline-grid;place-items:center;background:#3159d9;color:white;border-radius:17px;width:56px;height:56px;font-size:28px;font-weight:800}.muted{color:#74809b}.field{width:100%;padding:13px 14px;border:1px solid #dce3f2;border-radius:12px;background:#fff;margin:7px 0 15px;outline-color:#3159d9}.primary{background:#3159d9;color:white;border-radius:12px;padding:12px 17px;font-weight:700}.secondary{background:#eaf0ff;color:#3159d9;border-radius:11px;padding:10px 13px}.danger{background:#fff0f1;color:#b02a43;border-radius:11px;padding:10px 13px}.wide{width:100%}.app{display:flex;min-height:100vh}.sidebar{width:244px;background:#fff;border-right:1px solid #e5eaf5;padding:25px 17px;position:sticky;top:0;height:100vh}.brand{font-size:25px;font-weight:850;color:#3159d9;margin-bottom:36px}.nav{width:100%;text-align:left;padding:13px 15px;border-radius:12px;background:transparent;color:#64718d;margin-bottom:8px}.nav.active{background:#eaf0ff;color:#3159d9;font-weight:800}.main{flex:1;min-width:0;padding:32px;max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}.top h1{margin:0;font-size:29px}.card{background:#fff;border:1px solid #e7ecf6;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 5px 25px #304d8510}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.toolbar select{width:auto;min-width:160px;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.student{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #e4eaf6;border-radius:14px;padding:16px;background:#fff}.avatar{background:#edf2ff;color:#3159d9;border-radius:50%;height:39px;width:39px;display:grid;place-items:center;font-weight:800}.studentname{display:flex;align-items:center;gap:10px}.pen{background:#eaf0ff;color:#3159d9;border-radius:10px;padding:10px}.eval{border:1px solid #e7ecf6;border-radius:13px;padding:15px;margin:10px 0;cursor:pointer}.eval:hover{border-color:#3159d9}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.chip{border-radius:20px;padding:5px 10px;font-size:12px;font-weight:750}.vert{background:#d7f8e5;color:#167448}.bleu{background:#dceaff;color:#2356c1}.jaune{background:#fff2c6;color:#946600}.rouge{background:#ffe0e4;color:#ba3047}.notice{background:#eaf0ff;color:#2545a2;border-radius:12px;padding:12px;margin:12px 0}.modalwrap{position:fixed;inset:0;background:#15224699;display:grid;place-items:center;padding:14px;z-index:10}.modal{background:white;border-radius:22px;padding:23px;width:min(100%,590px);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:#eef1f8;border-radius:9px;padding:7px 11px}.competence{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;margin:10px 0}.competence input{margin:0}.competence select{margin:0;width:140px}.count{font-size:12px;color:#6d7891}.bell{position:relative;background:#eaf0ff;border-radius:12px;padding:10px}.dot{position:absolute;right:5px;top:4px;width:8px;height:8px;border-radius:50%;background:#e54865}.word{padding:15px;border:1px solid #e5eaf5;border-radius:13px;margin:10px 0}.word p{white-space:pre-wrap}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}.toast{position:fixed;right:16px;bottom:16px;background:#233e89;color:white;padding:13px 18px;border-radius:13px;z-index:30;box-shadow:0 10px 30px #0003}@media(max-width:720px){.app{display:block}.sidebar{position:sticky;top:0;width:100%;height:auto;padding:12px;z-index:3;border-bottom:1px solid #e5eaf5;display:flex;align-items:center;gap:10px}.brand{font-size:19px;margin:0 6px 0 0}.nav{width:auto;white-space:nowrap;margin:0;padding:10px}.main{padding:17px}.top h1{font-size:23px}.panel{padding:22px}.competence{grid-template-columns:1fr}.competence select{width:100%}}

/* Scolia final — pastilles et vue classe */
.pastille{display:inline-block;width:17px;height:17px;min-width:17px;border-radius:50%;vertical-align:middle;box-shadow:inset 0 0 0 1px #0000000c}
.pastille.vert{background:#22b36d}.pastille.bleu{background:#4385ed}.pastille.jaune{background:#f4bd39}.pastille.rouge{background:#eb5662}
.skillline{display:flex;align-items:center;gap:9px;margin:9px 0;flex-wrap:wrap}.statrow{display:grid;grid-template-columns:105px 1fr 46px;align-items:center;gap:9px;margin:12px 0}.barbg{height:11px;background:#edf0f7;border-radius:20px;overflow:hidden}.barfill{height:100%;border-radius:20px}.barfill.vert{background:#22b36d}.barfill.bleu{background:#4385ed}.barfill.jaune{background:#f4bd39}.barfill.rouge{background:#eb5662}
.roster{width:100%;border-collapse:collapse}.roster th,.roster td{padding:11px 9px;border-bottom:1px solid #edf0f6;text-align:left}.roster td:not(:first-child){text-align:center}.roster th:not(:first-child){text-align:center}.rosterwrap{overflow:auto}.bulkrow{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;border-bottom:1px solid #e9edf5;padding:10px 0}.bulkrow .field{margin:3px 0}.bigpen{display:inline-flex;gap:9px;align-items:center}.empty{padding:18px;background:#f7f9fd;border-radius:13px;color:#73809c}
@media(max-width:720px){.bulkrow{grid-template-columns:1fr}.roster th,.roster td{padding:9px 6px;font-size:13px}.statrow{grid-template-columns:85px 1fr 38px}.main{padding:14px}.card{padding:15px}.bigpen{width:100%;justify-content:center}}
.subject-list{display:flex;flex-direction:column;gap:0}.subject-item{display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%;padding:17px 13px;background:#fff;border-bottom:1px solid #e9edf6;color:#182641;gap:12px}.subject-item:last-child{border-bottom:0}.subject-item.chosen{background:#f2f6ff;border-left:4px solid #3159d9}.subject-item strong{display:block;font-size:16px}.subject-item small{display:block;margin-top:5px;color:#77849b;font-size:13px}.subject-right{color:#6b7894;font-size:12px;white-space:nowrap}.subject-right span{font-size:21px;margin-left:8px}@media(max-width:500px){.subject-item{padding:15px 8px}.subject-right{font-size:11px}}

/* Tableau des compétences directement visible */
.marks-table{width:100%;border-collapse:collapse;min-width:530px}.marks-table th{background:#128dcb;color:white;text-align:left;padding:14px}.marks-table td{padding:14px 12px;border-bottom:1px solid #e9edf5;vertical-align:middle}.marks-table td:first-child{width:42%}.marks-table .teacher{display:block;font-size:12px;color:#66758e;font-style:italic;margin-top:4px}.marks-table .marks{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mark-unit{display:inline-flex;align-items:center;gap:4px;background:#f5f8fe;border-radius:10px;padding:7px;cursor:pointer}.mark-unit:hover{background:#eaf0ff}.mark-unit .pastille{width:16px;height:16px;min-width:16px}.mark-title{font-size:11px;color:#687791;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.apprec-grid{display:grid;gap:12px}.apprec-item{border:1px solid #e4eaf6;border-radius:12px;padding:12px}.apprec-item textarea{margin-bottom:4px}.pill-status{border-radius:12px;background:#eaf0ff;padding:10px;color:#3159d9}.date-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:720px){.marks-table{min-width:0}.marks-table td,.marks-table th{padding:11px 7px}.marks-table td:first-child{width:44%}.mark-title{display:none}.mark-unit{padding:6px}.date-grid{grid-template-columns:1fr}.marks-table .teacher{font-size:11px}}

.bulletin-toolbar label{font-size:13px;font-weight:700;color:#53627f}.bulletin-toolbar .field{display:block;margin:5px 0 0}.bulletin-page{background:#fff;border:1px solid #e1e7f1;border-radius:15px;padding:28px;max-width:920px;margin:auto}.bulletin-head{display:flex;align-items:center;gap:14px;border-bottom:3px solid #3159d9;padding-bottom:15px}.bulletin-emblem{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:#3159d9;color:#fff;font-size:27px;font-weight:800}.bulletin-head h2{margin:0;font-size:20px}.bulletin-head p{margin:5px 0;color:#697891}.bulletin-meta{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:12px;margin:23px 0}.bulletin-meta div{background:#f4f7fd;padding:12px;border-radius:10px}.bulletin-meta span{display:block;font-size:10px;font-weight:800;color:#72809a;margin-bottom:7px}.bulletin-meta strong{font-size:14px}.bulletin-page h3{font-size:17px;margin:24px 0 12px}.bulletin-table{width:100%;border-collapse:collapse}.bulletin-table th{background:#eaf0ff;color:#2447a0;text-align:left}.bulletin-table th,.bulletin-table td{padding:13px;border:1px solid #e1e7f1}.bulletin-table td small{display:block;color:#72809a;margin-top:5px}.bulletin-colors{display:flex;gap:12px;flex-wrap:wrap}.bulletin-legend{display:inline-flex;gap:5px;align-items:center;font-size:13px}.bulletin-hint{font-size:12px;color:#65738a;line-height:1.7}.bulletin-app{border-left:3px solid #3159d9;padding:9px 14px;background:#f8faff;margin:10px 0}.bulletin-app p{white-space:pre-wrap;margin:7px 0}.bulletin-footer{border-top:1px solid #e2e8f2;margin-top:28px;padding-top:12px;color:#72809a;font-size:11px}@media(max-width:720px){.bulletin-page{padding:15px}.bulletin-meta{grid-template-columns:1fr}.bulletin-head h2{font-size:16px}.bulletin-table th,.bulletin-table td{padding:7px;font-size:12px}.bulletin-colors{gap:6px}}@media print{body{background:white!important}.sidebar,.top,.bulletin-toolbar,.bulletin-intro,#login,#modalHost,#toast{display:none!important}.app{display:block!important}.main{padding:0!important;max-width:none!important}.card{box-shadow:none}.bulletin-page{border:0!important;padding:0!important;max-width:none!important}.bulletin-head,.bulletin-table,.bulletin-meta,.bulletin-app{-webkit-print-color-adjust:exact;print-color-adjust:exact}#content>*:not(.bulletin-page){display:none!important}}

.grade{font-size:14px;color:#3159d9;white-space:nowrap}.grade.low{font-weight:900;color:#17213b}.gradebox{padding:10px 12px;background:#f4f7fd;border-radius:10px;margin:9px 0}.gradeinputs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.gradeinputs .field{margin:4px 0 12px}@media(max-width:450px){.gradeinputs{grid-template-columns:1fr 1fr}}
</style></head><body>
<section id="login" class="login"><div class="panel"><div class="logo">S</div><h1>Bienvenue sur Scolia</h1><p class="muted">Votre espace scolaire, simplement.</p><label>Identifiant<input class="field" id="username" autocomplete="username" placeholder="Votre identifiant"></label><label>Mot de passe<input class="field" id="password" type="password" autocomplete="current-password" placeholder="Votre mot de passe"></label><p id="loginError" style="color:#ba3047"></p><button class="primary wide" onclick="login()">Se connecter →</button><p class="muted" style="font-size:12px">Démo familiale avec données fictives uniquement. Les comptes HTML ne sécurisent pas les données en ligne.</p></div></section>
<div id="app" class="app hidden"><aside class="sidebar"><div class="brand">◈ Scolia</div><button class="nav active" data-tab="notes" onclick="tab('notes')">📘 Notes</button><button class="nav" data-tab="bulletins" onclick="tab('bulletins')">📄 Bulletins</button><button class="nav" data-tab="mots" onclick="tab('mots')">✉️ Mots</button><button class="nav hidden" id="appreciationsNav" data-tab="appreciations" onclick="tab('appreciations')">📝 Appréciations</button><button class="nav" data-tab="notifications" onclick="tab('notifications')">🔔 Alertes</button><button class="nav" onclick="logout()">↪ Quitter</button></aside><main class="main"><div class="top"><div><h1 id="pageTitle">Notes</h1><div class="muted" id="welcome"></div></div><button class="bell" onclick="tab('notifications')">🔔<span id="alertDot" class="dot hidden"></span></button></div><div id="content"></div></main></div><div id="modalHost"></div><div id="toast" class="toast hidden"></div>
<script>
// Démonstration uniquement : des mots de passe dans un HTML public ne sont PAS sécurisés.
const accounts=[{id:'elsahraoui',password:'Prof2026!',name:'M. El Sahraoui',role:'prof'},{id:'sahli',password:'Prof2026!',name:'M. Sahli',role:'prof'},{id:'sahliremplacant',password:'Prof2026!',name:'M. Sahli remplaçant',role:'prof'},{id:'gueblaoui',password:'Prof2026!',name:'M. Gueblaoui',role:'prof'},...['abdelrahman','ahmed','assia','leah','mohamed','nolan'].map(id=>({id,password:'Scolia2026!',name:id[0].toUpperCase()+id.slice(1),role:'eleve'}))];
const students=accounts.filter(x=>x.role==='eleve'),subjects=['Musique','Arts plastiques','Sport','Football','Technologie'],levels={vert:'Très bonne maîtrise',bleu:'Maîtrise satisfaisante',jaune:'Maîtrise fragile',rouge:'Maîtrise insuffisante'};
const classNames={'6A':'6ème A','6B':'6ème B'};const classOf=id=>['abdelrahman','ahmed','assia'].includes(id)?'6A':'6B';let selectedClass='6A';const classStudents=()=>students.filter(st=>classOf(st.id)===selectedClass);const classTeacher=c=>c==='6A'?'M. El Sahraoui':'M. Sahli';const currentWindow=()=>data.appWindows?.[selectedClass]||data.appWindow||{active:false,start:'',end:'',semester:'1'};const SESSION_KEY='scolia_session_v2';let data={evaluations:[],mots:[],alerts:[]},user=null,semester='1',subject='Musique',currentTab='notes';
// Aucune donnée scolaire stockée localement : Firebase uniquement.
data.appreciations??={};data.appWindow??={active:false,start:'',end:'',semester:'1'};
function save(){if(!window.scoliaCloudReady){toast('Firebase non connecté : enregistrement impossible');return;}window.scoliaCloudSave(structuredClone(data)).catch(e=>{console.error(e);toast('Échec Firebase : '+(e.code||e.message));})}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function notify(message,recipient){data.alerts.push({id:uid(),recipient,message,at:new Date().toISOString(),seen:false})}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3500)}
function login(){let id=document.getElementById('username').value.trim().toLowerCase(),pw=document.getElementById('password').value;user=accounts.find(a=>a.id===id&&a.password===pw)||null;if(!user){document.getElementById('loginError').textContent='Identifiant ou mot de passe incorrect';return}sessionStorage.setItem(SESSION_KEY,user.id);showLoggedIn();return;}function showLoggedIn(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('welcome').textContent=user.name+' · '+(user.role==='prof'?'Professeur':'Élève');selectedClass=user.role==='eleve'?classOf(user.id):(user.id==='sahli'?'6B':'6A');if(user.id==='gueblaoui')subject='Football';semester=studentSemester();document.getElementById('appreciationsNav').classList.toggle('hidden',user.role!=='prof');tab('notes')}function logout(){sessionStorage.removeItem(SESSION_KEY);user=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('password').value=''}function tab(t){currentTab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));document.getElementById('pageTitle').textContent={notes:'Notes & compétences',mots:'Mots',bulletins:'Bulletins',notifications:'Notifications',appreciations:'Appréciations'}[t];render()}
function render(){if(!user)return;document.getElementById('alertDot').classList.toggle('hidden',!data.alerts.some(a=>a.recipient===user.id&&!a.seen));if(currentTab==='notes')renderNotes();else if(currentTab==='bulletins')renderBulletins();else if(currentTab==='mots')renderMots();else if(currentTab==='appreciations')renderAppreciations();else renderAlerts()}
function renderNotes(){let filters=`<div class="toolbar"><select class="field" onchange="semester=this.value;render()"><option value="1" ${semester==='1'?'selected':''}>Semestre 1</option><option value="2" ${semester==='2'?'selected':''}>Semestre 2</option></select><select class="field" onchange="subject=this.value;render()">${subjects.map(s=>`<option ${subject===s?'selected':''}>${s}</option>`).join('')}</select></div>`;let c=document.getElementById('content');if(user.role==='prof'){c.innerHTML=filters+`<div class="card"><h2>Tableau des élèves</h2><p class="muted">Clique sur ✎ pour créer une évaluation pour un élève.</p><div class="grid">${students.map(s=>`<div class="student"><div class="studentname"><span class="avatar">${s.name[0]}</span><strong>${s.name}</strong></div><button class="pen" title="Évaluer ${s.name}" onclick="openEvalForm('${s.id}')">✎</button></div>`).join('')}</div></div>`+`<div class="card"><h2>Évaluations publiées</h2>${evalCards(data.evaluations.filter(e=>e.semester===semester&&e.subject===subject))}</div>`}else{c.innerHTML=filters+`<div class="card"><h2>Mes évaluations</h2><p class="muted">Clique sur une évaluation pour voir les compétences.</p>${evalCards(data.evaluations.filter(e=>e.student===user.id&&e.semester===semester&&e.subject===subject))}</div>`}}
function evalCards(list){if(!list.length)return '<p class="muted">Aucune évaluation pour le moment.</p>';return list.slice().reverse().map(e=>`<div class="eval" onclick="viewEval('${e.id}')"><strong>${esc(e.title)}</strong> <span class="muted">· ${esc(e.date)}</span>${user.role==='prof'?`<p class="count">${esc(students.find(s=>s.id===e.student)?.name||'')}</p>`:''}<div class="chips">${e.skills.map(x=>`<span class="chip ${x.level}">${esc(x.label)} · ${esc(levels[x.level])}</span>`).join('')}</div></div>`).join('')}
function modal(html){document.getElementById('modalHost').innerHTML=`<div class="modalwrap" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${html.title}</h2><button class="close" onclick="closeModal()">✕</button></div>${html.body}</div></div>`}function closeModal(){document.getElementById('modalHost').innerHTML=''}
function gradeValid(){if(selectedClass!=='6A')return null;const score=Number(document.getElementById('gradeScore')?.value),max=Number(document.getElementById('gradeMax')?.value),coef=Number(document.getElementById('gradeCoef')?.value);if(!Number.isFinite(score)||!Number.isFinite(max)||!Number.isFinite(coef)||max<=0||coef<=0||score<0||score>max||!document.getElementById('gradeScore')?.value.trim())return false;return {score,max,coef};}
function gradeFields(){return selectedClass==='6A'?`<h3>Note chiffrée — 6ème A</h3><div class="gradeinputs"><label>Note élève<input id="gradeScore" class="field" type="number" min="0" step="0.25" placeholder="Ex. 8" required></label><label>Sur combien ?<input id="gradeMax" class="field" type="number" min="1" step="0.25" value="20" required></label><label>Coefficient<input id="gradeCoef" class="field" type="number" min="0.25" step="0.25" value="1" required></label></div><p class="count">Les compétences ci-dessous sont liées à cette note.</p>`:''}
function gradeHtml(e){if(classOf(e.student)!=='6A'||!e.grade)return '';const g=e.grade;return `<span class="grade ${g.score<g.max/2?'low':''}">${esc(g.score)}/${esc(g.max)} · coef ${esc(g.coef)}</span>`}
function openEvalForm(student){if(user.role!=='prof'||!teacherAllowed(subject))return toast('Matière non autorisée');modal({title:'Nouvelle évaluation',body:`<p class="muted">Élève : ${esc(students.find(s=>s.id===student).name)} · ${esc(subject)} · Semestre ${semester}</p><label>Titre<input id="evalTitle" class="field" maxlength="100" placeholder="Ex. Évaluation de judo"></label><label>Date<input id="evalDate" class="field" type="date" value="${new Date().toISOString().slice(0,10)}"></label>${gradeFields()}<h3>Compétences</h3><div id="skillRows"></div><button class="secondary" onclick="addSkill()">+ Ajouter une compétence</button><p class="count">Maximum 10 compétences</p><button class="primary wide" onclick="publishEval('${student}')">Publier l'évaluation</button>`});addSkill()}
function addSkill(){let r=document.getElementById('skillRows');if(r.children.length>=10)return toast('Maximum 10 compétences');let d=document.createElement('div');d.className='competence';d.innerHTML=`<input class="field skillName" placeholder="Nom de la compétence" maxlength="120"><select class="field skillLevel">${Object.entries(levels).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}</select>`;r.append(d)}
function publishEval(student){if(!window.scoliaCloudReady)return toast('Attends la connexion à Firebase');if(user.role!=='prof'||!teacherAllowed(subject))return;let title=document.getElementById('evalTitle').value.trim(),date=document.getElementById('evalDate').value,skills=[...document.querySelectorAll('#skillRows .competence')].map(r=>({label:r.querySelector('.skillName').value.trim(),level:r.querySelector('.skillLevel').value})).filter(x=>x.label);if(!title||!date||!skills.length)return toast('Renseigne le titre, la date et une compétence');let grade=gradeValid();if(grade===false)return toast('Vérifie la note, le barème et le coefficient');data.evaluations.push({id:uid(),student,title,date,skills,semester,subject,author:user.name,...(grade?{grade}:{})});notify('Nouvelle évaluation : '+title,student);save();closeModal();render();toast('Évaluation publiée !')}
function viewEval(id){let e=data.evaluations.find(x=>x.id===id);if(!e)return;modal({title:esc(e.title),body:`<p class="muted">${esc(e.subject)} · ${esc(e.date)} · Semestre ${esc(e.semester)}</p><p class="muted">Publié par ${esc(e.author)}</p>${e.skills.map(s=>`<div class="word"><strong>${esc(s.label)}</strong><div class="chips"><span class="chip ${s.level}">${esc(levels[s.level])}</span></div></div>`).join('')}`})}
function renderMots(){let c=document.getElementById('content');if(user.role==='prof'){c.innerHTML=`<div class="card"><div class="top"><h2>Mots envoyés</h2><button class="primary" onclick="openWordForm()">+ Nouveau mot</button></div>${wordCards(data.mots)}</div>`}else{c.innerHTML=`<div class="card"><h2>Mes mots</h2>${wordCards(data.mots.filter(w=>w.recipients.includes(user.id)))}</div>`}}

function renderAlerts(){let list=data.alerts.filter(a=>a.recipient===user.id).reverse();document.getElementById('content').innerHTML=`<div class="card"><div class="top"><h2>Mes notifications</h2><button class="secondary" onclick="markRead()">Tout marquer comme lu</button></div>${list.length?list.map(a=>`<div class="word">${a.seen?'':'🔵 '}${esc(a.message)}<p class="count">${new Date(a.at).toLocaleString('fr-FR')}</p></div>`).join(''):'<p class="muted">Aucune notification.</p>'}</div>`}function markRead(){if(!window.scoliaCloudReady)return toast('Attends la connexion à Firebase');data.alerts.filter(a=>a.recipient===user.id).forEach(a=>a.seen=true);save();render()}

// ===== SCOLIA FINAL : ÉVALUATIONS DE CLASSE ET PASTILLES =====

const colorNames={vert:'Vert',bleu:'Bleu',jaune:'Jaune',rouge:'Rouge'};
function dots(skills){return '<div class="chips">'+skills.map(k=>`<span class="pastille ${k.level}" title="${esc(k.label)} : ${esc(levels[k.level])}" aria-label="${esc(k.label)} : ${esc(levels[k.level])}"></span>`).join('')+'</div>'}

function renderNotes(){
 const c=document.getElementById('content'),all=data.evaluations.filter(e=>e.semester===semester&&classOf(e.student)===selectedClass),teachers={'Musique':'M. Sahli','Arts plastiques':'M. Sahli','Sport':'M. El Sahraoui','Football':'M. Gueblaoui','Technologie':'M. Gueblaoui'};
 const semesterBar=`<div class="toolbar"><label style="display:flex;align-items:center;gap:7px">Classe ${user.role==='prof'?`<select class="field" style="margin:0;min-width:135px" onchange="selectedClass=this.value;semester='1';render()"><option value="6A" ${selectedClass==='6A'?'selected':''}>6ème A</option><option value="6B" ${selectedClass==='6B'?'selected':''}>6ème B</option></select>`:`<strong>${classNames[classOf(user.id)]}</strong>`}</label>${user.role==='prof'?`<select class="field" aria-label="Semestre" onchange="semester=this.value;render()"><option value="1" ${semester==='1'?'selected':''}>Semestre 1</option><option value="2" ${semester==='2'?'selected':''}>Semestre 2</option></select>`:`<span class="pill-status">Semestre ${studentSemester()}</span>`}</div>`;
 if(user.role==='prof'){
  const allowed=subjects.filter(teacherAllowed);if(!allowed.includes(subject))subject=allowed[0];const chosen=all.filter(e=>e.subject===subject),groups=new Map();chosen.filter(e=>e.groupId).forEach(e=>{if(!groups.has(e.groupId))groups.set(e.groupId,[]);groups.get(e.groupId).push(e)});
  c.innerHTML=semesterBar+`<div class="card"><h2>Mes matières</h2><div class="subject-list">${allowed.map(s=>`<button class="subject-item ${subject===s?'chosen':''}" onclick="subject='${s}';render()"><span><strong>${esc(s)}</strong><small>${esc(teachers[s])}</small></span><span>›</span></button>`).join('')}</div></div><div class="card"><div class="top" style="flex-wrap:wrap"><div><h2>${esc(subject)} — ${classNames[selectedClass]}</h2><p class="muted">${esc(teachers[subject])} · ${classTeacher(selectedClass)} (professeur principal) · Semestre ${semester}</p></div><button class="primary bigpen" onclick="openBulkEval()">✎ Évaluer toute la classe</button></div><div class="rosterwrap"><table class="roster"><thead><tr><th>Élève</th><th>Résultats</th><th>Stylo</th></tr></thead><tbody>${classStudents().map(st=>`<tr><td><strong>${esc(st.name)}</strong></td><td>${chosen.filter(e=>e.student===st.id).map(e=>`<button class="mark-unit" onclick="viewEval('${e.id}')" title="${esc(e.title)}">${gradeHtml(e)}${dots(e.skills)}</button>`).join('')||'—'}</td><td><button class="pen" onclick="openEvalForm('${st.id}')">✎</button></td></tr>`).join('')}</tbody></table></div></div><div class="card"><h2>Résultats de la classe</h2>${[...groups.values()].reverse().map(classReport).join('')||'<p class="muted">Les statistiques apparaîtront après une évaluation de classe.</p>'}</div>`;
 }else{
  semester=studentSemester();const own=data.evaluations.filter(e=>e.student===user.id&&e.semester===semester);
  c.innerHTML=semesterBar+`<div class="card" style="padding:0;overflow:hidden"><div class="rosterwrap"><table class="marks-table"><thead><tr><th>DISCIPLINES</th><th>ÉVALUATIONS</th></tr></thead><tbody>${['Arts plastiques','Musique','Sport'].map(mat=>`<tr><td><strong>${mat==='Musique'?'ÉDUCATION MUSICALE':mat.toUpperCase()}</strong><span class="teacher">${teachers[mat]}</span></td><td><div class="marks">${own.filter(e=>e.subject===mat).map(e=>`<button class="mark-unit" onclick="viewEval('${e.id}')" title="${esc(e.title)}">${gradeHtml(e)}${dots(e.skills)}<span class="mark-title">${esc(e.title)}</span></button>`).join('')||'<span class="muted">—</span>'}</div></td></tr>`).join('')}</tbody></table></div></div>${released()?`<div class="card"><h2>Appréciations du semestre 1</h2>${appreciationReadOnly(user.id)}</div>`:''}`;
 }
}
function classReport(g){let first=g[0],total=g.reduce((n,e)=>n+e.skills.length,0),count={vert:0,bleu:0,jaune:0,rouge:0};g.forEach(e=>e.skills.forEach(k=>{if(count[k.level]!==undefined)count[k.level]++}));let complete=classStudents().every(s=>g.some(e=>e.student===s.id&&e.skills.length));return `<div class="word"><div style="display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap"><strong>${esc(first.title)}</strong><span class="count">${g.length}/${classStudents().length} élèves évalués ${complete?'✓ Complet':'· En cours'}</span></div>${colorOrder.map(k=>{let pct=total?Math.round(100*count[k]/total):0;return `<div class="statrow"><span class="skillline"><span class="pastille ${k}"></span>${colorNames[k]}</span><div class="barbg"><div class="barfill ${k}" style="width:${pct}%"></div></div><strong>${pct}%</strong></div>`}).join('')}<p class="count">Pourcentages calculés sur ${total} compétences attribuées.</p></div>`}
function openBulkEval(){if(user.role!=='prof'||!teacherAllowed(subject))return toast('Matière non autorisée');modal({title:'✎ Évaluation de la '+classNames[selectedClass],body:`<p class="muted">${esc(subject)} · Semestre ${semester} · ${classStudents().length} élèves</p><label>Titre de l'évaluation<input id="bulkTitle" class="field" maxlength="100" placeholder="Ex. Judo : techniques de base"></label><label>Date<input id="bulkDate" class="field" type="date" value="${new Date().toLocaleDateString('en-CA')}"></label><h3>Compétences communes</h3><div id="bulkSkills"></div><button class="secondary" onclick="addBulkSkill()">+ Ajouter une compétence</button><p class="count">Jusqu'à 10 compétences. Choisis ensuite la couleur pour chaque élève.</p><div id="bulkRoster"></div><button class="primary wide" onclick="publishBulk()" style="margin-top:18px">Publier pour la classe</button>`});addBulkSkill();renderBulkRoster()}
function addBulkSkill(){let r=document.getElementById('bulkSkills');if(r.children.length>=10)return toast('Maximum 10 compétences');let d=document.createElement('div');d.className='skillline';d.innerHTML=`<input class="field bulkSkill" style="flex:1;min-width:180px;margin:4px 0" maxlength="120" placeholder="Nom de la compétence" oninput="renderBulkRoster()"><button class="danger" onclick="this.parentElement.remove();renderBulkRoster()" title="Supprimer">✕</button>`;r.append(d);renderBulkRoster()}
function renderBulkRoster(){let box=document.getElementById('bulkRoster');if(!box)return;let names=[...document.querySelectorAll('.bulkSkill')].map((x,i)=>({label:x.value.trim()||`Compétence ${i+1}`,i}));let previous={};let prevGrades={};box.querySelectorAll('[data-grade-student]').forEach(x=>prevGrades[x.dataset.gradeStudent+':'+x.dataset.gradeType]=x.value);box.querySelectorAll('select[data-student]').forEach(s=>previous[s.dataset.student+':'+s.dataset.skill]=s.value);box.innerHTML=`<h3>Notation des élèves</h3>${classStudents().map(st=>`<div class="bulkrow"><strong>${esc(st.name)}</strong><div>${selectedClass==='6A'?`<div class="gradeinputs"><label>Note<input class="field" type="number" min="0" step="0.25" data-grade-student="${st.id}" data-grade-type="score" value="${esc(prevGrades[st.id+':score']||'')}" placeholder="Note"></label><label>Sur<input class="field" type="number" min="1" step="0.25" data-grade-student="${st.id}" data-grade-type="max" value="${esc(prevGrades[st.id+':max']||'20')}"></label><label>Coef<input class="field" type="number" min="0.25" step="0.25" data-grade-student="${st.id}" data-grade-type="coef" value="${esc(prevGrades[st.id+':coef']||'1')}"></label></div>`:''}${names.map(n=>`<label style="display:block;font-size:12px;color:#65718c">${esc(n.label)}<select class="field" data-student="${st.id}" data-skill="${n.i}" aria-label="${esc(st.name)} : ${esc(n.label)}"><option value="">— Non évalué —</option>${colorOrder.map(k=>`<option value="${k}" ${previous[st.id+':'+n.i]===k?'selected':''}>${colorNames[k]} · ${esc(levels[k])}</option>`).join('')}</select></label>`).join('')}</div></div>`).join('')}`}
function publishBulk(){if(!window.scoliaCloudReady)return toast('Attends la connexion à Firebase');if(user.role!=='prof'||!teacherAllowed(subject))return;let title=document.getElementById('bulkTitle').value.trim(),date=document.getElementById('bulkDate').value,skills=[...document.querySelectorAll('.bulkSkill')].map(x=>x.value.trim());if(!title||!date||!skills.length||skills.some(x=>!x))return toast('Indique un titre, une date et le nom de chaque compétence');let entries=classStudents().map(st=>({student:st.id,skills:skills.map((label,i)=>({label,level:document.querySelector(`select[data-student="${st.id}"][data-skill="${i}"]`)?.value})).filter(x=>x.level)}));if(entries.some(e=>!e.skills.length))return toast('Attribue au moins une pastille à chaque élève');if(selectedClass==='6A'){for(const e of entries){const v=t=>document.querySelector(`[data-grade-student="${e.student}"][data-grade-type="${t}"]`)?.value;const score=Number(v('score')),max=Number(v('max')),coef=Number(v('coef'));if(!v('score')||!Number.isFinite(score)||!Number.isFinite(max)||!Number.isFinite(coef)||score<0||max<=0||score>max||coef<=0)return toast('Vérifie les notes, barèmes et coefficients des 3 élèves');e.grade={score,max,coef}}}let groupId=uid();entries.forEach(e=>{data.evaluations.push({id:uid(),groupId,student:e.student,title,date,skills:e.skills,semester,subject,author:user.name,...(e.grade?{grade:e.grade}:{})});notify('Nouvelle évaluation : '+title,e.student)});save();closeModal();render();toast('Évaluation publiée pour la classe !')}
function viewEval(id){let e=data.evaluations.find(x=>x.id===id);if(!e)return;modal({title:esc(e.title),body:`<p class="muted">${esc(e.subject)} · ${esc(e.date)} · Semestre ${esc(e.semester)}</p><p class="muted">${user.role==='prof'?esc(students.find(s=>s.id===e.student)?.name)+' · ':''}Publié par ${esc(e.author)}</p>${gradeHtml(e)?`<div class="gradebox">Note : ${gradeHtml(e)}</div>`:''}${e.skills.map(s=>`<div class="word"><div class="skillline"><span class="pastille ${s.level}"></span><strong>${esc(s.label)}</strong></div><span class="count">${esc(levels[s.level])}</span></div>`).join('')}`})}

// Appréciations : seule la direction (M. El Sahraoui) active la période.
function appKey(sem,teacher,student){return [sem,teacher,student].join('|')}
function appreciationReadOnly(id){const names={'elsahraoui':'M. El Sahraoui','sahli':'M. Sahli','sahliremplacant':'M. Sahli remplaçant','gueblaoui':'M. Gueblaoui'};let found=Object.entries(names).map(([tid,name])=>({name,text:data.appreciations[appKey('1',tid,id)]})).filter(x=>x.text);return found.length?found.map(x=>`<div class="apprec-item"><strong>${esc(x.name)}</strong><p>${esc(x.text)}</p></div>`).join(''):'<p class="muted">Aucune appréciation saisie.</p>'}
function renderAppreciations(){if(user.role!=='prof')return;const w=currentWindow(),main=(selectedClass==='6A'&&user.id==='elsahraoui')||(selectedClass==='6B'&&user.id==='sahli'),canWrite=w.active&&new Date()>=new Date(w.start+'T00:00:00')&&new Date()<=new Date(w.end+'T23:59:59');document.getElementById('content').innerHTML=`<div class="toolbar"><label>Classe <select class="field" onchange="selectedClass=this.value;render()"><option value="6A" ${selectedClass==='6A'?'selected':''}>6ème A</option><option value="6B" ${selectedClass==='6B'?'selected':''}>6ème B</option></select></label></div>${main?`<div class="card"><h2>Gestion des appréciations — ${classNames[selectedClass]}</h2><p class="muted">${classNames[selectedClass]} — Définis la période pendant laquelle les professeurs peuvent rédiger leurs appréciations. À la fin, elles seront visibles aux élèves et leur tableau passera au semestre 2.</p><div class="date-grid"><label>Début<input class="field" id="startApp" type="date" value="${esc(w.start)}"></label><label>Fin<input class="field" id="endApp" type="date" value="${esc(w.end)}"></label></div><button class="primary" onclick="activateApp()">${w.active?'Modifier les dates':'Activer la période'}</button> ${w.active?'<button class="danger" onclick="deactivateApp()">Désactiver</button>':''}</div>`:''}<div class="card"><h2>Appréciations — Semestre 1</h2><p class="pill-status">${!w.active?'Période non activée':released()?'Période terminée — appréciations publiées':`Du ${dateFR(w.start)} au ${dateFR(w.end)}`}</p><p class="muted">${canWrite?'Tu peux rédiger les appréciations des six élèves.':'La saisie est disponible uniquement pendant la période activée.'}</p><div class="apprec-grid">${classStudents().map(st=>`<div class="apprec-item"><strong>${esc(st.name)}</strong><textarea class="field" id="app_${st.id}" rows="3" maxlength="1500" ${canWrite?'':'disabled'} placeholder="Appréciation de ${esc(st.name)}">${esc(data.appreciations[appKey('1',user.id,st.id)]||'')}</textarea>${canWrite?`<button class="secondary" onclick="saveApp('${st.id}')">Enregistrer</button>`:''}</div>`).join('')}</div></div>`}
function activateApp(){if(!window.scoliaCloudReady)return toast('Attends la connexion à Firebase');if(!((selectedClass==='6A'&&user.id==='elsahraoui')||(selectedClass==='6B'&&user.id==='sahli')))return;let start=document.getElementById('startApp').value,end=document.getElementById('endApp').value;if(!start||!end||start>end)return toast('Choisis des dates valides');data.appWindows??={};data.appWindows[selectedClass]={active:true,start,end,semester:'1'};save();render();toast('Période activée')}
function deactivateApp(){if(!window.scoliaCloudReady)return toast('Attends la connexion à Firebase');if(!((selectedClass==='6A'&&user.id==='elsahraoui')||(selectedClass==='6B'&&user.id==='sahli')))return;data.appWindows??={};data.appWindows[selectedClass]={...currentWindow(),active:false};save();render();toast('Période désactivée')}
function saveApp(id){if(!window.scoliaCloudReady)return toast('Attends la connexion à Firebase');let w=currentWindow();if(user.role!=='prof'||!w.active||new Date()<new Date(w.start+'T00:00:00')||new Date()>new Date(w.end+'T23:59:59'))return toast('Période fermée');data.appreciations[appKey('1',user.id,id)]=document.getElementById('app_'+id).value.trim();save();toast('Appréciation enregistrée')}

// Bulletins calculés depuis les évaluations et appréciations déjà synchronisées dans Firestore.
let bulletinSemester='1',bulletinStudent='';
function bulletinFor(id,sem){
 const st=students.find(x=>x.id===id);if(!st)return '<p>Élève introuvable.</p>';
 const cls=classOf(id),list=data.evaluations.filter(e=>e.student===id&&String(e.semester)===String(sem));
 const teacherBySubject={'Sport':'M. El Sahraoui','Musique':'M. Sahli','Arts plastiques':'M. Sahli','Football':'M. Gueblaoui','Technologie':'M. Gueblaoui'};
 const rows=subjects.map(mat=>{
   const evaluations=list.filter(e=>e.subject===mat),count={vert:0,bleu:0,jaune:0,rouge:0};
   evaluations.forEach(e=>(e.skills||[]).forEach(sk=>{if(count[sk.level]!==undefined)count[sk.level]++}));
   const total=Object.values(count).reduce((a,b)=>a+b,0);const graded=evaluations.filter(e=>e.grade&&e.grade.max>0&&e.grade.coef>0);const weight=graded.reduce((n,e)=>n+e.grade.coef,0);const average=weight?graded.reduce((n,e)=>n+20*e.grade.score/e.grade.max*e.grade.coef,0)/weight:null;
   const chips=total?colorOrder.map(k=>count[k]?`<span class="bulletin-legend"><span class="pastille ${k}"></span>${count[k]}</span>`:'').join(''):'<span class="muted">Non évalué</span>';
   return `<tr><td><strong>${esc(mat)}</strong><small>${esc(teacherBySubject[mat])}</small></td><td>${evaluations.length}</td>${cls==='6A'?`<td>${average===null?'—':`<span class="grade ${average<10?'low':''}">${average.toFixed(2).replace('.',',')}/20</span>`}</td>`:''}<td><div class="bulletin-colors">${chips}</div></td></tr>`;
 }).join('');
 const teachers={'elsahraoui':'M. El Sahraoui','sahli':'M. Sahli','sahliremplacant':'M. Sahli remplaçant','gueblaoui':'M. Gueblaoui'};
 const appreciations=Object.entries(teachers).map(([tid,name])=>({name,value:data.appreciations?.[appKey(sem,tid,id)]})).filter(x=>x.value);
 const appHtml=appreciations.length?appreciations.map(x=>`<div class="bulletin-app"><strong>${esc(x.name)}</strong><p>${esc(x.value)}</p></div>`).join(''):'<p class="muted">Aucune appréciation enregistrée pour ce semestre.</p>';
 return `<article class="bulletin-page" id="bulletinPaper"><div class="bulletin-head"><div class="bulletin-emblem">S</div><div><h2>SCOLIA · BULLETIN SEMESTRIEL</h2><p>Année scolaire 2026–2027 · Semestre ${esc(sem)}</p></div></div><div class="bulletin-meta"><div><span>ÉLÈVE</span><strong>${esc(st.name)}</strong></div><div><span>CLASSE</span><strong>${esc(classNames[cls])}</strong></div><div><span>PROFESSEUR PRINCIPAL</span><strong>${esc(classTeacher(cls))}</strong></div></div><h3>Résultats et compétences</h3><table class="bulletin-table"><thead><tr><th>Matière</th><th>Évaluations</th>${cls==='6A'?'<th>Moyenne</th>':''}<th>Compétences</th></tr></thead><tbody>${rows}</tbody></table><p class="bulletin-hint">🟢 Très bonne maîtrise · 🔵 Maîtrise satisfaisante · 🟡 Maîtrise fragile · 🔴 Maîtrise insuffisante</p><h3>Appréciations des professeurs</h3>${appHtml}<div class="bulletin-footer">Bulletin de démonstration généré à partir des données Scolia · ${esc(classNames[cls])}</div></article>`;
}
function renderBulletins(){
 const isProf=user.role==='prof';
 if(!isProf){bulletinStudent=user.id;selectedClass=classOf(user.id)}
 else if(!classStudents().some(s=>s.id===bulletinStudent))bulletinStudent=classStudents()[0]?.id||'';

 };
 tx.set(ref,{state:merged});
});
